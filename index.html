<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Goa E-Paper | Daily Newspapers</title>
<meta name="description" content="Read the latest Goa newspapers from their official e-paper editions.">
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f6;
  color:#111827;
}
header{
  background:#111827;
  color:white;
  padding:22px 16px;
  text-align:center;
}
header h1{margin:0;font-size:27px}
header p{margin:7px 0 0;color:#d1d5db;font-size:14px}
.container{max-width:850px;margin:auto;padding:18px}
.status{
  background:white;border-radius:14px;padding:14px 16px;margin-bottom:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);font-size:13px;color:#4b5563;
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.card{
  background:white;border-radius:16px;padding:18px;
  box-shadow:0 3px 14px rgba(0,0,0,.08);
}
.card h2{margin:0 0 6px;font-size:20px}
.lang{font-size:13px;color:#6b7280;margin-bottom:14px}
.date{font-size:13px;margin-bottom:15px;color:#374151}
.button{
  display:block;text-align:center;text-decoration:none;
  background:#111827;color:white;padding:12px;border-radius:10px;
  font-weight:bold;
}
.button:hover{opacity:.9}
.error{color:#b91c1c}
footer{text-align:center;padding:25px;color:#6b7280;font-size:12px}
@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  header h1{font-size:23px}
}
</style>
</head>
<body>

<header>
  <h1>📰 Goa E-Paper</h1>
  <p>Latest editions • Updated automatically</p>
</header>

<main class="container">
  <div class="status" id="status">Checking latest editions…</div>
  <div class="grid" id="papers"></div>
</main>

<footer>
  Newspapers open on their official e-paper website.
</footer>

<script>
const statusEl = document.getElementById("status");
const papersEl = document.getElementById("papers");

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

async function loadPapers(){
  try{
    // Cache-buster prevents an old data.json being kept by the browser.
    const response = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
    if(!response.ok) throw new Error("Could not load latest data.");
    const data = await response.json();

    papersEl.innerHTML = data.papers.map(p => `
      <article class="card">
        <h2>${esc(p.name)}</h2>
        <div class="lang">${esc(p.description)}</div>
        <div class="date">Published: <strong>${esc(p.published)}</strong></div>
        <a class="button" href="${esc(p.read_url)}" target="_blank" rel="noopener noreferrer">
          Read Newspaper
        </a>
      </article>
    `).join("");

    statusEl.textContent =
      "Last automatic check: " + (data.updated || "Unknown");
  }catch(err){
    statusEl.className = "status error";
    statusEl.textContent = "Unable to load the latest newspaper information.";
  }
}

loadPapers();
</script>
</body>
</html>
